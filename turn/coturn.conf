# Coturn TURN/STUN Server Configuration for PhoneToUSB
# Reference: RFC 5766 / RFC 8656

# Listening ports
listening-port=3478
tls-listening-port=5349

# Public IP of your server (Replace with actual static WAN IP)
# external-ip=203.0.113.10

# Realm and static auth secret for ephemeral HMAC-SHA1 tokens
realm=turn.phonetousb.example.com
use-auth-secret
static-auth-secret=coturn-shared-secret-for-ephemeral-turn-credentials

# Dynamic relay port range (ensure opened in firewall)
min-port=49152
max-port=65535

# Security hardening
fingerprint
lt-cred-mech
no-tcp-relay
no-multicast-peers
no-cli
log-file=stdout
verbose
