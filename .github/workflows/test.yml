name: Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-receiver-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows-receiver/requirements.txt
          pip install -r backend/requirements.txt

      - name: Run Windows Receiver tests
        run: |
          python -m pytest windows-receiver/tests/ -v

      - name: Run Backend Coordination tests
        run: |
          python -m pytest backend/tests/ -v

      - name: Run End-to-End Integration tests
        run: |
          python -m pytest tests/test_end_to_end_integration.py -v

  android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Android unit tests
        working-directory: android-app
        run: |
          chmod +x ./gradlew || true
          ./gradlew test --no-daemon
