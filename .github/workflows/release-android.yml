name: Release Android Application

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Release APK
        working-directory: android-app
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleRelease --no-daemon

      - name: Compute APK Checksum
        id: checksum
        working-directory: android-app/app/build/outputs/apk/release
        run: |
          cp app-release-unsigned.apk PhoneToUSB-${{ github.ref_name }}.apk
          sha256sum PhoneToUSB-${{ github.ref_name }}.apk > PhoneToUSB-${{ github.ref_name }}.apk.sha256
          echo "HASH=$(cat PhoneToUSB-${{ github.ref_name }}.apk.sha256 | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT

      - name: Create Release Manifest
        working-directory: android-app/app/build/outputs/apk/release
        run: |
          cat <<EOF > release-manifest.json
          {
            "version": "${{ github.ref_name }}",
            "release_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "android": {
              "version_name": "${{ github.ref_name }}",
              "filename": "PhoneToUSB-${{ github.ref_name }}.apk",
              "sha256": "${{ steps.checksum.outputs.HASH }}"
            }
          }
          EOF

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/app/build/outputs/apk/release/PhoneToUSB-${{ github.ref_name }}.apk
            android-app/app/build/outputs/apk/release/PhoneToUSB-${{ github.ref_name }}.apk.sha256
            android-app/app/build/outputs/apk/release/release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
