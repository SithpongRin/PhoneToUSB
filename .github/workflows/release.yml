name: Build and Release USB Transfer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask segno pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --onefile --noconsole --clean --noupx --icon "app_icon.ico" --version-file "version_info.txt" --name "USB_Transfer" app.py

      - name: Determine Version Tag
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            APP_VER=$(python -c "import re; m = re.search(r'APP_VERSION\s*=\s*[\"\\\']([^\"\\\']+)[\"\\\']', open('app.py', encoding='utf-8').read()); print(m.group(1) if m else '1.0.1')")
            VERSION="v${APP_VER}"
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: USB Transfer ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: dist/USB_Transfer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
