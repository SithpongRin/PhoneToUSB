name: Official Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Release Assets
        run: |
          ls -lh dist/
          test -f dist/PhoneToUSB.apk || { echo "Missing dist/PhoneToUSB.apk"; exit 1; }
          test -f dist/PhoneToUSB.exe || { echo "Missing dist/PhoneToUSB.exe"; exit 1; }

      - name: Generate Release Manifest
        run: |
          APK_HASH=$(cat dist/PhoneToUSB.apk.sha256 | tr -d '\r\n')
          EXE_HASH=$(cat dist/PhoneToUSB.exe.sha256 | tr -d '\r\n')
          cat <<EOF > release-manifest.json
          {
            "version": "${{ github.ref_name }}",
            "release_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "android": {
              "filename": "PhoneToUSB.apk",
              "sha256": "$APK_HASH"
            },
            "windows": {
              "filename": "PhoneToUSB.exe",
              "sha256": "$EXE_HASH"
            }
          }
          EOF

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "PhoneToUSB Release ${{ github.ref_name }}"
          body: |
            ## PhoneToUSB Production Release ${{ github.ref_name }}
            Secure Internet-Based USB Storage and File Management System.

            ### Downloads:
            - **Android Smartphone App**: [`PhoneToUSB.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PhoneToUSB.apk) (Includes real-time CameraX QR Code Scanner)
            - **Windows Laptop Receiver**: [`PhoneToUSB.exe`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PhoneToUSB.exe) (Portable standalone executable, no ZIP extraction needed)

            ### Integrity SHA-256 Checksums:
            - `PhoneToUSB.apk`: `${{ env.APK_HASH }}`
            - `PhoneToUSB.exe`: `${{ env.EXE_HASH }}`
          files: |
            dist/PhoneToUSB.apk
            dist/PhoneToUSB.apk.sha256
            dist/PhoneToUSB.exe
            dist/PhoneToUSB.exe.sha256
            release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
