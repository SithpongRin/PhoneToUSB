name: Build and Release USB Transfer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask segno pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --onefile --noconsole --clean --noupx --icon "app_icon.ico" --name "USB_Transfer" app.py

      - name: Determine Version Tag
        id: get_version
        run: |
          python -c "import os, re; content = open('app.py', encoding='utf-8').read(); m = re.search(r'APP_VERSION\s*=\s*[\x22\x27]([^\x22\x27]+)[\x22\x27]', content); tag = 'v' + (m.group(1) if m else '1.0.1'); open(os.environ['GITHUB_OUTPUT'], 'a').write(f'tag={tag}\n'); print('Determined release tag:', tag)"

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: USB Transfer ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: dist/USB_Transfer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
