name: Release Windows Receiver

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows-receiver/requirements.txt

      - name: Build Portable Windows Receiver
        working-directory: windows-receiver
        run: |
          powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Package USB Distribution Zip
        working-directory: windows-receiver
        run: |
          powershell -ExecutionPolicy Bypass -File package_usb.ps1
          Copy-Item dist\PhoneToUSB-Windows.zip dist\PhoneToUSB-${{ github.ref_name }}-Windows.zip
          (Get-FileHash -Algorithm SHA256 dist\PhoneToUSB-${{ github.ref_name }}-Windows.zip).Hash | Out-File dist\PhoneToUSB-${{ github.ref_name }}-Windows.zip.sha256

      - name: Upload Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-receiver/dist/PhoneToUSB-${{ github.ref_name }}-Windows.zip
            windows-receiver/dist/PhoneToUSB-${{ github.ref_name }}-Windows.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
